aid: briefcase
name: Briefcase
description: >-
  Briefcase is an AI-native accounting and bookkeeping automation platform for
  UK accounting firms and businesses. Founded in 2024 in London by Reuben
  Steenkamp and Ján Stehlík, and backed by Earlybird Venture Capital,
  Entrepreneur First and Tiny, Briefcase describes itself as building the
  world's first AI autopilot for accounting firms. The product uses multimodal
  AI and agentic workflows to automate the most tedious parts of accounting:
  extracting data from invoices, receipts and bank statements, categorising
  transactions against a firm's chart of accounts, handling VAT (with embedded
  HMRC legislation for standard, reverse-charge and zero-rated VAT), automating
  prepayments and expense claims, and driving month-end and financial close. It
  publishes results into Xero and QuickBooks. Briefcase is delivered as a
  cloud SaaS application (app.briefcase.so); it is a consumer of accounting
  APIs rather than a public API producer, and at the time of this profile it
  publishes no developer/API documentation, OpenAPI, or SDKs.
